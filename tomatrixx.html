<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tomatrix simples</title>
<style>
:root{--bg:#eef2ea;--card:#fff;--ink:#1c2a22;--mute:#5d6e63;--line:#d3dccf;--ok:#2e7d45;--warn:#b7791f;--bad:#c23a2b;--acc:#2e7d45;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121a15;--card:#1a251e;--ink:#e6efe8;--mute:#92a69a;--line:#2b3b31;--ok:#5fcf80;--warn:#e3a94b;--bad:#ff7a69;--acc:#5fcf80}}
:root[data-theme="dark"]{--bg:#121a15;--card:#1a251e;--ink:#e6efe8;--mute:#92a69a;--line:#2b3b31;--ok:#5fcf80;--warn:#e3a94b;--bad:#ff7a69;--acc:#5fcf80}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:760px;margin:auto;padding:18px 14px 40px}
h1{font-size:1.4rem;margin:0 0 2px}
h2{font-size:1.05rem;margin:0 0 10px}
.sub{color:var(--mute);margin:0 0 16px;font-size:.9rem}
.tabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.tab{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:7px 13px;border-radius:99px;cursor:pointer}
.tab.on{background:var(--acc);border-color:var(--acc);color:#fff}
.tab.rm{border-color:var(--bad);color:var(--bad);padding:7px 11px;font-size:.88rem}
.tab.add{border-style:dashed;color:var(--mute)}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:14px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;margin-bottom:10px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
label{display:block;font-size:.85rem;color:var(--mute)}
input{width:100%;margin-top:3px;padding:8px;border:1px solid var(--line);border-radius:7px;background:var(--bg);color:var(--ink);font:inherit}
.hint{font-size:.78rem;margin-top:3px;min-height:1.1em}
.ok{color:var(--ok)}.warn{color:var(--warn)}.bad{color:var(--bad)}
button.b{padding:8px 14px;border-radius:7px;border:1px solid var(--acc);background:var(--acc);color:#fff;cursor:pointer;font:inherit}
button.g{background:none;border:1px solid var(--line);color:var(--mute);padding:5px 10px;border-radius:7px;cursor:pointer;font:inherit;font-size:.82rem}
table{width:100%;border-collapse:collapse;font-size:.88rem}
th,td{text-align:left;padding:7px 6px;border-bottom:1px solid var(--line)}
th{color:var(--mute);font-weight:600}
.scroll{overflow-x:auto}
.act{margin:0;padding-left:18px}
.act li{margin-bottom:4px}
.score{font-size:1.6rem;font-weight:700}
.empty{color:var(--mute);font-size:.9rem}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.chip{border:1px solid var(--line);background:var(--bg);color:var(--ink);padding:6px 12px;border-radius:99px;cursor:pointer;font:inherit;font-size:.88rem}
.chip.on{background:var(--acc);border-color:var(--acc);color:#fff}
tr.cl{cursor:pointer}
tr.cl:hover td{background:var(--bg)}
.sgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.sc{border:1px solid var(--line);border-top:4px solid var(--c);border-radius:10px;padding:12px;background:var(--bg)}
.sc[data-t]{cursor:pointer}
.s-ok{--c:var(--ok)}.s-warn{--c:var(--warn)}.s-bad{--c:var(--bad)}
.sh{display:flex;justify-content:space-between;align-items:center}
.ic{font-size:1.4rem}
.bd{font-size:.72rem;font-weight:700;padding:2px 8px;border-radius:99px;border:1px solid currentColor}
.sn{color:var(--mute);font-size:.82rem;margin-top:6px}
.sv{font-size:1.9rem;font-weight:800;line-height:1.1}
.sv small{font-size:.8rem;color:var(--mute);font-weight:500}
.gz{position:relative;height:8px;border-radius:99px;background:var(--line);margin-top:12px}
.zone{position:absolute;top:0;bottom:0;background:var(--ok);opacity:.4;border-radius:99px}
.mk{position:absolute;top:50%;width:7px;height:20px;border-radius:4px;transform:translate(-50%,-50%);border:2px solid var(--card)}
.gl{display:flex;justify-content:space-between;font-size:.68rem;color:var(--mute);margin-top:3px}
.sp{width:100%;height:28px;margin-top:6px;display:block}
.top{display:flex;gap:16px;align-items:center;margin-bottom:14px}
.ring{width:80px;height:80px;border-radius:50%;background:conic-gradient(currentColor calc(var(--p)*1%),var(--line) 0);display:grid;place-items:center;flex:none}
.ring span{width:62px;height:62px;border-radius:50%;background:var(--card);display:grid;place-items:center;font-weight:800;font-size:1.15rem;color:var(--ink)}
.rt{font-size:1.1rem;font-weight:700}
.acs{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
.ac{padding:6px 10px;border-radius:8px;font-size:.85rem;border:1px solid currentColor}
.ac span{color:var(--ink)}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;background:var(--line)}
.dot.ok{background:var(--ok)}.dot.warn{background:var(--warn)}.dot.bad{background:var(--bad)}

</style>
</head>
<body>
<main>
  <h1>Tomatrix simples</h1>
  <p class="sub">Digite as leituras de cada canteiro e veja o que precisa de atenção.</p>

  <div class="tabs" id="tabs"></div>

  <div class="card">
    <div class="row">
      <h2 id="nome"></h2>
      <div><button class="g" id="ren">Renomear</button> <button class="g" id="del">Remover canteiro</button></div>
    </div>
    <div class="grid" id="campos"></div>
    <div class="row" style="margin:12px 0 0">
      <label style="flex:1;min-width:150px">Horário ou observação (opcional)<input id="obs" placeholder="ex: 07:30 manhã"></label>
      <button class="b" id="salvar">Salvar leitura</button>
    </div>
    <div class="hint" id="msg"></div>
  </div>

  <div class="card">
    <h2>Situação atual</h2>
    <div id="sit"></div>
  </div>

  <div class="card" id="topicoCard">
    <h2>Ver um sensor em todos os canteiros</h2>
    <div class="chips" id="chips"></div>
    <div class="scroll" id="topico"></div>
  </div>

  <div class="card">
    <div class="row"><h2>Histórico</h2><button class="g" id="limpar">Limpar histórico</button></div>
    <div class="scroll" id="hist"></div>
  </div>
</main>

<script>
const M=[
{k:"solo",n:"Umidade do solo",u:"%",ok:[60,80],w:[45,90],lo:"Irrigar agora",hi:"Reduzir irrigação"},
{k:"temp",n:"Temperatura",u:"°C",ok:[18,28],w:[12,34],lo:"Proteger do frio",hi:"Ventilar ou sombrear"},
{k:"ar",n:"Umidade do ar",u:"%",ok:[50,70],w:[35,85],lo:"Nebulizar",hi:"Ventilar (risco de míldio)"},
{k:"ph",n:"pH do solo",u:"",ok:[6,6.8],w:[5.5,7.2],lo:"Aplicar calcário",hi:"Corrigir com enxofre"},
{k:"luz",n:"Luminosidade",u:"klux",ok:[30,60],w:[15,80],lo:"Checar sombreamento",hi:"Usar tela de sombra"},
{k:"nut",n:"Nutrientes NPK",u:"%",ok:[60,90],w:[40,100],lo:"Adubar com NPK",hi:"Lavar o solo"},
{k:"chuva",n:"Chuva",u:"mm/h",ok:[0,2],w:[0,8],lo:"",hi:"Suspender irrigação"}
];
const G={solo:[0,100],temp:[5,45],ar:[0,100],ph:[4,9],luz:[0,100],nut:[0,100],chuva:[0,30]};
const I={solo:'💧',temp:'🌡️',ar:'💨',ph:'⚗️',luz:'☀️',nut:'🌱',chuva:'🌧️'};
const $=id=>document.getElementById(id);
const TXT={ok:"Ideal",warn:"Atenção",bad:"Crítico"};
let S={beds:[{n:"Estufa 1",r:[]},{n:"Estufa 2",r:[]},{n:"Campo aberto",r:[]}],sel:0};
try{const raw=localStorage.getItem("tomatrix_simples");if(raw){const o=JSON.parse(raw);if(o&&o.beds&&o.beds.length)S=o}}catch(e){}
const save=()=>{try{localStorage.setItem("tomatrix_simples",JSON.stringify(S))}catch(e){}};
const cur=()=>S.beds[S.sel];
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function estado(m,v){
  if(v>=m.ok[0]&&v<=m.ok[1])return"ok";
  if(v>=m.w[0]&&v<=m.w[1])return"warn";
  return"bad";
}
// valor atual de cada sensor = última leitura preenchida
function atual(b){
  const o={};
  for(const r of b.r)for(const m of M)if(r.v[m.k]!==undefined)o[m.k]=r.v[m.k];
  return o;
}

function tabs(){
  $("tabs").innerHTML=S.beds.map((b,i)=>`<button class="tab ${i===S.sel?"on":""}" data-i="${i}"><span class="dot ${notaDe(b)===null?"":corNota(notaDe(b))}"></span>${esc(b.n)}</button>`+(i===S.sel?`<button class="tab rm" id="rm" title="Remover este canteiro">✕ Remover</button>`:"")).join("")+`<button class="tab add" id="novo">+ Canteiro</button>`;
  document.querySelectorAll(".tab[data-i]").forEach(t=>t.onclick=()=>{S.sel=+t.dataset.i;save();tudo()});
  $("rm").onclick=delBed;
  $("novo").onclick=()=>{const n=prompt("Nome do novo canteiro:");if(n&&n.trim()){S.beds.push({n:n.trim(),r:[]});S.sel=S.beds.length-1;save();tudo()}};
}

function campos(){
  $("nome").textContent=cur().n;
  $("campos").innerHTML=M.map(m=>`<label>${m.n}${m.u?" ("+m.u+")":""}
    <input type="number" step="0.1" data-k="${m.k}" placeholder="ideal ${m.ok[0]} a ${m.ok[1]}">
    <div class="hint" id="h_${m.k}"></div></label>`).join("");
  document.querySelectorAll("#campos input").forEach(inp=>inp.oninput=()=>{
    const m=M.find(x=>x.k===inp.dataset.k),h=$("h_"+m.k);
    if(inp.value===""){h.textContent="";h.className="hint";return}
    const e=estado(m,parseFloat(inp.value));h.textContent=TXT[e];h.className="hint "+e;
  });
}

function notaDe(b){const a=atual(b),ks=M.filter(m=>a[m.k]!==undefined);if(!ks.length)return null;return Math.round(ks.reduce((t,m)=>t+{ok:100,warn:50,bad:0}[estado(m,a[m.k])],0)/ks.length)}
const corNota=n=>n>=75?"ok":n>=45?"warn":"bad";
function gauge(m,v,e){
  const [lo,hi]=G[m.k],f=x=>Math.max(0,Math.min(100,(x-lo)/(hi-lo)*100));
  return`<div class="gz"><i class="zone" style="left:${f(m.ok[0])}%;width:${f(m.ok[1])-f(m.ok[0])}%"></i><b class="mk" style="left:${f(v)}%;background:var(--${e})"></b></div><div class="gl"><span>${lo}</span><span>ideal ${m.ok[0]}–${m.ok[1]}</span><span>${hi}</span></div>`;
}
function spark(vals,e){
  if(vals.length<2)return"";
  const lo=Math.min(...vals),hi=Math.max(...vals),g=hi-lo||1;
  const pts=vals.map((v,i)=>(i*100/(vals.length-1)).toFixed(1)+","+(26-(v-lo)/g*24).toFixed(1)).join(" ");
  return`<svg class="sp" viewBox="0 0 100 28" preserveAspectRatio="none"><polyline fill="none" stroke="var(--${e})" stroke-width="2" vector-effect="non-scaling-stroke" points="${pts}"/></svg>`;
}
const serie=(b,k)=>b.r.filter(r=>r.v[k]!==undefined).map(r=>r.v[k]);
function card(b,m,attr){
  const h=serie(b,m.k);
  if(!h.length)return`<div class="sc"><div class="sh"><span class="ic">${I[m.k]}</span></div><div class="sn">${esc(attr||m.n)}</div><div class="empty">sem leitura</div></div>`;
  const v=h[h.length-1],e=estado(m,v);
  return`<div class="sc s-${e}" ${attr?"":`data-t="${m.k}" title="Ver em todos os canteiros"`}><div class="sh"><span class="ic">${I[m.k]}</span><span class="bd ${e}">${TXT[e]}</span></div><div class="sn">${esc(attr||m.n)}</div><div class="sv">${v}<small> ${m.u}</small></div>${gauge(m,v,e)}${spark(h.slice(-12),e)}</div>`;
}

function situacao(){
  const b=cur(),a=atual(b),ks=M.filter(m=>a[m.k]!==undefined),n=notaDe(b);
  if(n===null){$("sit").innerHTML=`<div class="empty">Nenhuma leitura ainda. Preencha os campos acima e salve.</div>`;return}
  const c=corNota(n),acoes=[];
  ks.forEach(m=>{const v=a[m.k],e=estado(m,v);if(e!=="ok"){const t=v<m.ok[0]?m.lo:m.hi;if(t)acoes.push(`<div class="ac ${e}">${I[m.k]} <span><b>${m.n}</b>: ${t}</span></div>`)}});
  $("sit").innerHTML=`<div class="top"><div class="ring ${c}" style="--p:${n}"><span>${n}%</span></div><div><div class="rt">${n>=75?"Condições boas":n>=45?"Precisa de atenção":"Intervenção necessária"}</div><div class="sub" style="margin:2px 0 0">Saúde de ${esc(b.n)} · toque num sensor para comparar</div></div></div>
  <div class="sgrid">${M.map(m=>card(b,m)).join("")}</div>
  ${acoes.length?`<div class="acs">${acoes.join("")}</div>`:`<div class="empty" style="margin-top:12px">✅ Tudo dentro do ideal.</div>`}`;
  document.querySelectorAll(".sc[data-t]").forEach(el=>el.onclick=()=>{
    topic=el.dataset.t;topicos();
    $("topicoCard").scrollIntoView({behavior:"smooth",block:"start"});
  });
}

let topic=null;
function topicos(){
  $("chips").innerHTML=M.map(m=>`<button class="chip ${m.k===topic?"on":""}" data-c="${m.k}">${I[m.k]} ${m.n}</button>`).join("");
  document.querySelectorAll("[data-c]").forEach(c=>c.onclick=()=>{topic=c.dataset.c;topicos()});
  const m=M.find(x=>x.k===topic);
  if(!m){$("topico").innerHTML=`<div class="empty">Escolha um sensor para comparar todos os canteiros.</div>`;return}
  $("topico").innerHTML=`<div class="sgrid">${S.beds.map(b=>card(b,m,b.n)).join("")}</div>`;
}

function historico(){
  const r=cur().r;
  if(!r.length){$("hist").innerHTML=`<div class="empty">Sem leituras salvas.</div>`;return}
  const cab=M.map(m=>`<th>${m.n}</th>`).join("");
  const li=r.slice().reverse().map((x,j)=>{
    const idx=r.length-1-j;
    return`<tr><td>${esc(x.t)}</td>${M.map(m=>{const v=x.v[m.k];return v===undefined?"<td>-</td>":`<td class="${estado(m,v)}">${v}</td>`}).join("")}<td><button class="g" data-d="${idx}">x</button></td></tr>`;
  }).join("");
  $("hist").innerHTML=`<table style="min-width:640px"><tr><th>Quando</th>${cab}<th></th></tr>${li}</table>`;
  document.querySelectorAll("[data-d]").forEach(b=>b.onclick=()=>{cur().r.splice(+b.dataset.d,1);save();tudo()});
}

$("salvar").onclick=()=>{
  const v={};
  document.querySelectorAll("#campos input").forEach(i=>{const n=parseFloat(i.value);if(Number.isFinite(n))v[i.dataset.k]=n});
  if(!Object.keys(v).length){$("msg").textContent="Preencha pelo menos um campo.";$("msg").className="hint bad";return}
  const t=$("obs").value.trim()||new Date().toLocaleString("pt-BR",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"});
  cur().r.push({t,v});save();
  $("obs").value="";
  campos();situacao();topicos();historico();
  $("msg").textContent="Leitura salva.";$("msg").className="hint ok";
};
$("ren").onclick=()=>{const n=prompt("Novo nome:",cur().n);if(n&&n.trim()){cur().n=n.trim();save();tudo()}};
function delBed(){
  if(S.beds.length<2){alert("Mantenha pelo menos um canteiro.");return}
  if(!confirm("Remover "+cur().n+" e todas as leituras dele?"))return;
  S.beds.splice(S.sel,1);S.sel=0;save();tudo();
}
$("del").onclick=delBed;
$("limpar").onclick=()=>{if(confirm("Apagar todas as leituras de "+cur().n+"?")){cur().r=[];save();tudo()}};

function tudo(){tabs();campos();situacao();topicos();historico();$("msg").textContent=""}
tudo();
</script>
</body>
</html>
