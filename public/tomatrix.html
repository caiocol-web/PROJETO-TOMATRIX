<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tomatrix simples</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="sequencia.css">
</head>

<body>
  <!-- PAINEL DA SEQUÊNCIA DA HORTA -->
  <aside id="painel-sequencia" class="painel-sequencia">
    <h2>Minha sequência</h2>

    <div id="tomate-mascote" class="tomate-mascote">🍅</div>

    <p id="sequencia-semanas" class="sequencia-semanas">0 semanas</p>

    <div class="vidas-tomate">
      <span id="vida-1">❤️</span>
      <span id="vida-2">❤️</span>
      <span id="vida-3">❤️</span>
    </div>

    <p id="mensagem-sequencia" class="mensagem-sequencia">
      Registre uma leitura para cuidar do seu tomate!
    </p>

    <p id="estado-tomate" class="estado-tomate">Tomate saudável</p>
  </aside>

  <main>
    <h1>Tomatrix simples</h1>
    <p class="subtitulo">Digite as leituras de cada canteiro e veja o que precisa de atenção.</p>

    <div class="abas" id="abas"></div>

    <section class="card">
      <div class="linha">
        <h2 id="nome-canteiro"></h2>
      </div>

      <div class="grade-campos" id="campos"></div>

      <div class="linha linha-salvar">
        <label class="campo-observacao">
          Observação (opcional)
          <input type="text" id="observacao" placeholder="ex: depois da irrigação">
        </label>
        <button class="btn-principal" id="btn-salvar">Salvar leitura</button>
      </div>
      <div class="dica" id="mensagem"></div>
    </section>

    <section class="card">
      <h2>Situação atual</h2>
      <div id="situacao"></div>
    </section>

    <section class="card" id="card-comparacao">
      <h2>Ver um sensor em todos os canteiros</h2>
      <div class="filtros" id="filtros"></div>
      <div class="rolagem" id="comparacao"></div>
    </section>

    <section class="card">
      <div class="linha">
        <h2>Histórico</h2>
        <button class="btn-secundario" id="btn-limpar">Limpar histórico</button>
      </div>
      <div class="rolagem" id="historico"></div>
    </section>
  </main>

  <script src="sequencia.js"></script>
  <script src="script.js"></script>
</body>

</html>
